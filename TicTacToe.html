<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe vs AI</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #game-container {
            text-align: center;
        }
        canvas {
            background-color: white;
            border: 2px solid #000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        #status {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            height: 30px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="ticTacToe" width="300" height="300"></canvas>
    <div id="status">Your Turn (X)</div>
</div>

<script>
    const canvas = document.getElementById('ticTacToe');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    let board = Array(9).fill(' ');
    let currentPlayer = 'X'; // Human is always X
    let isGameOver = false;

    // Draw the structural lines and board items
    function drawBoard() {
        ctx.clearRect(0, 0, 300, 300);
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, 300, 300);

        // Draw structural gridlines
        ctx.strokeStyle = "black";
        ctx.lineWidth = 5;
        for (let i = 1; i < 3; i++) {
            // Vertical lines
            ctx.beginPath();
            ctx.moveTo(i * 100, 0);
            ctx.lineTo(i * 100, 300);
            ctx.stroke();

            // Horizontal lines
            ctx.beginPath();
            ctx.moveTo(0, i * 100);
            ctx.lineTo(300, i * 100);
            ctx.stroke();
        }

        // Draw X and O tokens
        ctx.fillStyle = "black";
        ctx.font = "74px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (let i = 0; i < 9; i++) {
            if (board[i] !== ' ') {
                let col = i % 3;
                let row = Math.floor(i / 3);
                let x = col * 100 + 50;
                let y = row * 100 + 50;
                ctx.fillText(board[i], x, y);
            }
        }
    }

    function checkWinner() {
        // FIXED: Re-added the complete 3x3 grid matching data combinations
        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];
        
        for (let combo of winningCombinations) {
            // FIXED: Fully bound indices combo[0], combo[1], combo[2]
            if (board[combo[0]] === board[combo[1]] && board[combo[1]] === board[combo[2]] && board[combo[0]] !== ' ') {
                return true;
            }
        }
        return false;
    }

    function resetGame() {
        isGameOver = true;
        setTimeout(() => {
            board = Array(9).fill(' ');
            currentPlayer = 'X';
            isGameOver = false;
            statusDiv.innerText = "Your Turn (X)";
            drawBoard();
        }, 1500); 
    }

    function aiMove() {
        if (isGameOver) return;

        let emptyPositions = [];
        for (let i = 0; i < 9; i++) {
            if (board[i] === ' ') emptyPositions.push(i);
        }

        if (emptyPositions.length > 0) {
            let randomIndex = Math.floor(Math.random() * emptyPositions.length);
            let chosenIndex = emptyPositions[randomIndex];
            board[chosenIndex] = 'O';
            drawBoard();

            if (checkWinner()) {
                statusDiv.innerText = "Player O (AI) wins!";
                resetGame();
            } else if (!board.includes(' ')) {
                statusDiv.innerText = "It's a tie!";
                resetGame();
            } else {
                currentPlayer = 'X';
                statusDiv.innerText = "Your Turn (X)";
            }
        }
    }

    canvas.addEventListener('click', function(event) {
        if (currentPlayer !== 'X' || isGameOver) return;

        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        const col = Math.floor(x / 100);
        const row = Math.floor(y / 100);
        const index = row * 3 + col;

        if (board[index] === ' ') {
            board[index] = 'X';
            drawBoard();

            if (checkWinner()) {
                statusDiv.innerText = "Player X wins!";
                resetGame();
            } else if (!board.includes(' ')) {
                statusDiv.innerText = "It's a tie!";
                resetGame();
            } else {
                currentPlayer = 'O';
                statusDiv.innerText = "AI is thinking...";
                setTimeout(aiMove, 500); 
            }
        }
    });

    drawBoard();
</script>

</body>
</html>
